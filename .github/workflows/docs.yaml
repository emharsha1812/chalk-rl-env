name: Docs
on:
  pull_request:
    paths:
      - docs/**
      - website/**
      - scripts/build_sites.py
      - scripts/build_cloudflare.py
      - pyproject.toml
      - uv.lock
      - zensical.toml
      - .github/workflows/docs.yaml
  push:
    branches:
      - main
    paths:
      - docs/**
      - website/**
      - scripts/build_sites.py
      - scripts/build_cloudflare.py
      - pyproject.toml
      - uv.lock
      - zensical.toml
      - .github/workflows/docs.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Build website and documentation
        run: uv run --frozen --only-group docs python scripts/build_cloudflare.py
