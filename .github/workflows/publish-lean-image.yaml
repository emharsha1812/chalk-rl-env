name: Publish Lean base image
on:
  workflow_dispatch:
    inputs:
      use_local_base:
        description: Use an existing base on a temporary trusted runner
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ${{ inputs.use_local_base && fromJSON('["self-hosted", "Linux", "X64", "chalk-release-publisher"]') || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep registry credentials in the temporary runner directory
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/chalk-docker-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - name: Make room on the temporary GitHub runner
        if: ${{ !inputs.use_local_base }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - name: Download the task and build its Lean base
        if: ${{ !inputs.use_local_base }}
        run: python3 src/chalk/templates/lean-math/setup_data.py
      - name: Download the task and licenses for an existing Lean base
        if: ${{ inputs.use_local_base }}
        run: |
          docker image inspect chalk-fineenvs-lean-base:d7056fd >/dev/null
          python3 src/chalk/templates/lean-math/setup_data.py --data-only
      - name: Add licenses and tag the base image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-lean-base:d7056fd-${GITHUB_SHA:0:12}"
          docker build --file scripts/lean-base-release.Containerfile \
            --build-arg "CHALK_SOURCE=https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg "CHALK_REVISION=${GITHUB_SHA}" \
            --tag "$image" src/chalk/templates/lean-math
          echo "CHALK_RELEASE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Sign in to the container registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish and show the immutable image reference
        run: |
          docker push "$CHALK_RELEASE_IMAGE"
          docker image inspect "$CHALK_RELEASE_IMAGE" --format '{{index .RepoDigests 0}}'
      - name: Remove registry credentials
        if: ${{ always() }}
        run: docker logout ghcr.io || true
