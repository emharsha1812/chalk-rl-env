[project]
site_name = "Chalk"
site_description = "RL environments for coding and mathematical reasoning."
docs_dir = "content"
site_dir = "site"
extra_css = ["stylesheets/home.css"]
extra_javascript = ["javascripts/anatomy.js"]
nav = [{ "Home" = "index.md" }]
copyright = "Chalk is open source."

[project.theme]
language = "en"
font = false
logo = "assets/chalk-symbol-white.png"
favicon = "assets/favicon.png"
features = ["content.code.copy"]

[project.extra]
generator = false

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
